# Pull requests with updates of the dependencies, once a week and against
# develop, so that the versions do not stand still between releases. Minor
# and patch updates of one ecosystem come together in one pull request; a
# major version comes alone, because it needs reading.
#
# Security updates (a pull request as soon as an advisory is published) are
# switched on in the repository settings, not here:
# Settings -> Advanced Security -> Dependabot security updates. Those go
# against the default branch, whatever target-branch says below.
#
# This file is read from the default branch only. A pull request that
# updates Filament or its plugins needs `php artisan filament:assets` run
# and committed with it; Backend CI says so when it is missing. Nothing in
# CI builds the root npm project, so its updates are not tested.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      php-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      administration-assets-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /docker/production/frontend
      - /docker/production/nginx
      - /docker/common/rdkit
      - /database/extensions/bingo
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    # A new major version of a base image is a migration, not an update: the
    # database image is published under the tag of its PostgreSQL version
    # and opens the data directory production already has.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
