name: Backend CI

on:
  # Called by release.yml before the images are published.
  workflow_call:
  pull_request:
    branches: [develop, main]
    paths: &backend_paths
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/**"
      - "modules/**"
      - "routes/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
      - ".github/workflows/backend-ci.yml"
      - ".github/scripts/coverage-summary.php"
      # The deployment scripts are run by tests/Unit/Deployment.
      - "docker/production/*.sh"
      # tests/Unit/Deployment also runs the release notes script and checks the changelog.
      - ".github/scripts/changelog-notes.sh"
      - "CHANGELOG.md"
  push:
    branches: [develop, main]
    paths: *backend_paths

permissions:
  contents: read

env:
  PHP_VERSION: "8.4"

jobs:
  lint:
    name: Pint (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      # This repo has never been Pint-formatted as a whole (263 pre-existing
      # files fail --test on the Laravel preset, mostly old migrations).
      # Rather than a big-bang reformat, CI only enforces style on files
      # actually touched by this PR/push — new and edited code must be
      # clean, untouched legacy files are left alone for now.
      - name: Determine changed PHP files
        id: changed
        # A branch name is chosen by whoever opens the pull request; written
        # into the script as an expression it would be run as shell code.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # Release PR (develop -> main): the cumulative diff is effectively the
          # whole repository, and every commit in it already passed this same
          # gate when it was pushed to develop. Re-running it here would only
          # re-report the pre-existing findings this job exists to stay out of.
          if [ "$EVENT_NAME" = "pull_request" ] \
             && [ "$BASE_REF" = "main" ] \
             && [ "$HEAD_REF" = "develop" ]; then
            echo "Release PR (develop -> main) — already gated on every push to develop. Skipping Pint."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Merging that release into main arrives as one push whose diff is
          # again the whole release. When the push is exactly one merge commit
          # on top of the previous main, what it brings in was checked on
          # develop or in its pull request, so it is not checked a second time.
          # This relies on the "Create a merge commit" method: a squash or
          # rebase merge has a single parent and is checked like any other
          # commit, and so are commits pushed to main together with a merge.
          if [ "$EVENT_NAME" = "push" ] \
             && [ "$GITHUB_REF" = "refs/heads/main" ] \
             && git rev-parse --quiet --verify "$PUSH_SHA^2^{commit}" >/dev/null \
             && [ "$(git rev-parse --quiet --verify "$PUSH_SHA^1^{commit}")" = "$PUSH_BEFORE_SHA" ]; then
            echo "A single merge commit on main — its changes were gated before the merge. Skipping Pint."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            HEAD_SHA="$PR_HEAD_SHA"
            # A PR is checked out as the merge commit, whose parent IS the base
            # branch tip, so diffing straight against that tip also drags in
            # every commit that landed on the base branch after this one forked.
            # The merge base is the real "what does this branch change" line.
            BASE_SHA=$(git merge-base "$PR_BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)
          else
            HEAD_SHA="$PUSH_SHA"
            BASE_SHA="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "No comparable base commit found — skipping Pint (nothing to diff against, e.g. first push of a branch)."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '*.php' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Run Pint on changed files
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: vendor/bin/pint --test $FILES

  test:
    name: Test suite
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      # Needed for the runner's GITHUB_TOKEN to pull the private
      # ghcr.io/molmedb/ci-bingo-postgres image published by
      # bingo-postgres-image.yml — the workflow-level `contents: read`
      # above replaces (not merges with) GITHUB_TOKEN's default scopes,
      # so packages:read must be requested explicitly here.
      packages: read
    services:
      db:
        image: ghcr.io/molmedb/ci-bingo-postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: molmedb_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: molmedb_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # The `predictions` connection uses sqlite (:memory:) here — its
      # schema (modules/PredictionWorkers/database/migrations, not on the
      # default migration path) is migrated per-test by tests/Pest.php,
      # not by this env config.
      DB_PREDICTIONS_DRIVER: sqlite
      DB_PREDICTIONS_DATABASE: ":memory:"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_CLIENT: predis
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_pgsql, pgsql, bcmath, gd, zip, intl
          coverage: pcov
          # By default pcov watches only ./app (or src, lib); modules/ is
          # source code as well.
          ini-values: pcov.directory=., pcov.exclude="~/(vendor|node_modules|frontend|storage)/~"

      - uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: php artisan migrate --force

      # public/ holds the assets Filament and its plugins publish, and the
      # production image is built without running composer's scripts. An
      # update of those packages that does not come with the republished
      # assets (a Dependabot pull request, for one) would serve old ones.
      - name: Published Filament assets are current
        run: |
          php artisan filament:assets
          if [ -n "$(git status --porcelain -- public)" ]; then
            git status --short -- public
            echo "::error::The published assets in public/ do not match the installed packages. Run \`php artisan filament:assets\` and commit the result."
            exit 1
          fi

      # Coverage is measured and reported, not enforced: there is no minimum
      # a run could fail on. Asked for coverage without a driver, PHPUnit
      # runs no test at all, so the option is added only when pcov is loaded.
      - name: Run tests
        run: |
          COVERAGE=""
          if php -m | grep -qix pcov; then
            COVERAGE="--coverage-clover=coverage/clover.xml"
          else
            echo "::warning::pcov is not loaded, running the tests without coverage."
          fi
          php artisan test $COVERAGE

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/clover.xml') != '' }}
        continue-on-error: true
        run: php .github/scripts/coverage-summary.php coverage/clover.xml >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('coverage/clover.xml') != '' }}
        continue-on-error: true
        with:
          name: backend-coverage
          path: coverage/clover.xml
          retention-days: 14
