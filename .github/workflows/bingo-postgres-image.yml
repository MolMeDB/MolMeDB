name: Build bingo Postgres image

# Builds the Postgres 15 + bingo cartridge image used as the test database
# for backend CI (smiles / substructure search needs the real extension —
# it cannot run against sqlite). Published to GHCR so backend-ci.yml can
# pull a ready image as a `services:` container instead of rebuilding it
# on every run.
#
# The same image runs the production databases (docker-compose-production.yaml)
# as ghcr.io/molmedb/molmedb-db. It is versioned by the PostgreSQL major
# version, not by the application release, so deploying a release does not
# restart the databases; the commit tag allows pinning (MOLMEDB_DB_VERSION).
# It is published from main only: a change on develop must not reach the
# production databases.
on:
  push:
    branches: [develop, main]
    paths:
      - "database/extensions/bingo/**"
      - ".github/workflows/bingo-postgres-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/molmedb/ci-bingo-postgres
  PRODUCTION_IMAGE: ghcr.io/molmedb/molmedb-db

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: database/extensions/bingo
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:15
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:15', env.PRODUCTION_IMAGE) || '' }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:{1}', env.PRODUCTION_IMAGE, github.sha) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
