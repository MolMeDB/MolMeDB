name: Dependency audit

# Known vulnerabilities in the versions the lock files pin. The other
# workflows install exactly those versions and only run when code changes,
# so nothing else would notice an advisory:
#   - on a pull request and a push, for a lock file that changed;
#   - every morning for main and develop, for an advisory published against
#     versions that are already released or about to be. GitHub e-mails a
#     failed scheduled run to whoever last changed the schedule below.
#
# A high or critical advisory fails the job; lower ones are listed.
# Development packages are audited too: they run on the machines and in the
# workflows that build what is released.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer:
    name: PHP packages${{ matrix.ref && format(' ({0})', matrix.ref) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A scheduled run starts on the default branch only, so it checks
        # out both branches itself; any other run audits what triggered it.
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["main", "develop"]' || '[""]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      # Reads composer.lock only; nothing is installed. An advisory without
      # a severity counts as one that fails.
      - name: High and critical advisories
        run: composer audit --locked --abandoned=report --ignore-severity=low --ignore-severity=medium

      - name: All advisories (does not fail the job)
        if: always()
        run: composer audit --locked --abandoned=report || true

  npm:
    name: npm packages (${{ matrix.project.name }}${{ matrix.ref && format(', {0}', matrix.ref) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["main", "develop"]' || '[""]') }}
        project:
          - name: frontend
            directory: frontend
          # The asset build of the administration.
          - name: administration assets
            directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Reads package-lock.json only. Everything found is printed; the exit
      # status follows the level.
      - name: High and critical advisories
        working-directory: ${{ matrix.project.directory }}
        run: npm audit --package-lock-only --audit-level=high
