name: Docker image build validation

# Build-only validation (no push, no deploy) that the production images
# still build. They are published by release.yml on a version tag.
on:
  pull_request:
    branches: [develop, main]
    paths: &docker_paths
      - "docker/production/**"
      - "docker/common/php-fpm/**"
      - "docker/common/rdkit/**"
      - "modules/**"
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "composer.json"
      - "composer.lock"
      - "public/**"
      - "frontend/**"
      - ".github/workflows/docker-build-validate.yml"
  push:
    branches: [develop, main]
    paths: *docker_paths

permissions:
  contents: read

jobs:
  backend-image:
    name: Backend (php-fpm, production target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/common/php-fpm/Dockerfile
          target: production
          push: false
          load: true
          tags: molmedb-backend:ci
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      # Tests run on the runner's PHP, which has every extension; only the
      # image tells whether production has them. bcmath: without it (or GMP)
      # web push logs a notice on every notification.
      - name: PHP extensions the application needs
        run: |
          modules=$(docker run --rm --entrypoint php molmedb-backend:ci -m)
          missing=0
          for extension in bcmath pdo_pgsql pgsql intl gd zip mbstring pcntl openssl curl; do
            if ! grep -qix "$extension" <<< "$modules"; then
              echo "::error::The production image lacks the PHP extension $extension."
              missing=1
            fi
          done
          exit $missing

  nginx-image:
    name: Nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: this only validates that the Dockerfile itself builds — it
      # copies public/ as-is without requiring built Vite assets to be
      # present. It deliberately does NOT run `npm run build` (root
      # package.json) first: that build is currently broken on develop
      # (tailwind.config.js references a Filament v3-era preset path that
      # no longer exists in the installed Filament v5/Tailwind v4 setup),
      # unrelated to this workflow — see the follow-up task for that.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/production/nginx/Dockerfile
          push: false
          cache-from: type=gha,scope=nginx-image
          cache-to: type=gha,mode=max,scope=nginx-image

  frontend-image:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./docker/production/frontend/Dockerfile
          push: false
          build-args: |
            JWT_SECRET=ci-build-placeholder
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

  rdkit-image:
    name: RDKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./modules/Rdkit/src
          file: ./docker/common/rdkit/Dockerfile
          push: false
          cache-from: type=gha,scope=rdkit-image
          cache-to: type=gha,mode=max,scope=rdkit-image
