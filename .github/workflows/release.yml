name: Release

# Builds the production images for a release tag and publishes them to GHCR.
# Deploy on the server: set MOLMEDB_VERSION and run
#   docker compose -f docker-compose-production.yaml pull
#   docker compose -f docker-compose-production.yaml up -d
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-ci:
    name: Backend CI
    uses: ./.github/workflows/backend-ci.yml

  frontend-ci:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yml

  publish:
    name: Publish ${{ matrix.name }}
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: ./docker/common/php-fpm/Dockerfile
            target: production
          - name: nginx
            context: .
            file: ./docker/production/nginx/Dockerfile
            target: production
          - name: rdkit
            context: ./modules/Rdkit/src
            file: ./docker/common/rdkit/Dockerfile
            target: ""
          - name: frontend
            context: ./frontend
            file: ./docker/production/frontend/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/molmedb/molmedb-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JWT_SECRET=ci-build-placeholder
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
