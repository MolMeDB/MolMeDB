services:
  # The only entry point: routes every MolMeDB domain to the frontend,
  # Laravel, CDK Depict or the RDF dereferencing, see
  # docker/production/nginx/README.md. Plain HTTP, reachable only from the
  # host, where the TLS proxy (Apache) passes all domains to it.
  web:
    image: molmedb-nginx
    build:
      context: .
      dockerfile: ./docker/production/nginx/Dockerfile
      target: production
    container_name: molmedb-nginx
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/storage
    tty: true
    environment:
      MOLMEDB_SITE_HOST: ${MOLMEDB_SITE_HOST:-molmedb.upol.cz}
      MOLMEDB_ADMIN_HOST: ${MOLMEDB_ADMIN_HOST:-admin.molmedb.upol.cz}
      MOLMEDB_RDF_HOST: ${MOLMEDB_RDF_HOST:-rdf.molmedb.upol.cz}
    ports:
      - "127.0.0.1:8443:80"
    networks:
      - molmedb-network
    depends_on:
      app:
        condition: service_started
      storage-init:
        condition: service_completed_successfully

  # One-shot setup step: ./storage is a host bind-mount, so it can be empty on
  # a fresh host and silently shadow whatever directory structure the image
  # creates at build time. Every other service waits for this to finish
  # successfully before starting, regardless of whether it goes through
  # entrypoint.sh (the worker services bypass it via entrypoint: []).
  storage-init:
    image: molmedb-backend
    container_name: molmedb-storage-init
    user: "root"
    entrypoint: []
    command:
      - sh
      - -c
      - |
        mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
        chown -R www-data:www-data storage
        chmod -R 775 storage
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
    networks:
      - molmedb-network
    restart: "no"

  app:
    image: molmedb-backend
    user: "www-data"
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: production
    restart: unless-stopped
    container_name: molmedb-backend
    volumes:
      - ./storage:/var/www/storage
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=5432
      - DB_PREDICTIONS_HOST=db-predictions
      - DB_PREDICTIONS_PORT=5432
      - DB_QUEUE_RETRY_AFTER=1900
      - REDIS_HOST=redis
    networks:
      - molmedb-network
    depends_on:
      db:
        condition: service_healthy
      db-predictions:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  app-scheduler-worker:
    image: molmedb-backend 
    container_name: molmedb-scheduler-worker
    tty: true
    env_file:
      - .env
    environment:
      - SERVICE_TAGS=dev
      - SERVICE_NAME=molmedb-scheduler-worker
      - DB_HOST=db
      - DB_PORT=5432
      - DB_PREDICTIONS_HOST=db-predictions
      - DB_PREDICTIONS_PORT=5432
      - DB_QUEUE_RETRY_AFTER=1900
      - REDIS_HOST=redis
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
    networks:
      - molmedb-network
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      db-predictions:
        condition: service_healthy
      redis:
        condition: service_healthy
      rdkit:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    entrypoint: []
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped 

  app-queue-worker:
    image: molmedb-backend
    container_name: molmedb-queue-worker
    tty: true
    env_file:
      - .env
    environment:
      - SERVICE_TAGS=dev
      - SERVICE_NAME=molmedb-queue-worker
      - DB_HOST=db
      - DB_PORT=5432
      - DB_PREDICTIONS_HOST=db-predictions
      - DB_PREDICTIONS_PORT=5432
      - DB_QUEUE_RETRY_AFTER=1900
      - REDIS_HOST=redis
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
    networks:
      - molmedb-network
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      db-predictions:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    entrypoint: []
    command: ["php", "artisan", "queue:work", "--queue=upload,default", "--sleep=3", "--tries=3", "--timeout=1800", "--memory=512"]
    restart: unless-stopped

  app-predictions-queue-worker:
    image: molmedb-backend
    container_name: molmedb-predictions-queue-worker
    tty: true
    env_file:
      - .env
    environment:
      - SERVICE_TAGS=dev
      - SERVICE_NAME=molmedb-predictions-queue-worker
      - DB_HOST=db
      - DB_PORT=5432
      - DB_PREDICTIONS_HOST=db-predictions
      - DB_PREDICTIONS_PORT=5432
      - DB_QUEUE_RETRY_AFTER=1900
      - REDIS_HOST=redis
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
    networks:
      - molmedb-network
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      db-predictions:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    entrypoint: []
    command: ["php", "artisan", "queue:work", "--queue=predictions", "--sleep=5", "--tries=1", "--timeout=150", "--memory=256"]
    restart: unless-stopped

  # Served by the web service on the site domain, not published itself.
  frontend:
    container_name: molmedb-frontend
    build:
      context: ./frontend
      dockerfile: ../docker/production/frontend/Dockerfile
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    networks:
      - molmedb-network
    env_file:
      - ./frontend/.env
    environment:
      - NEXT_BACKEND_URL=http://web
      - NEXT_PUBLIC_BACKEND_URL=https://${MOLMEDB_ADMIN_HOST:-admin.molmedb.upol.cz}
    depends_on:
      app:
        condition: service_started

  db:
    build: ./database/extensions/bingo
    platform: linux/amd64
    privileged: true
    container_name: molmedb-dev-db
    env_file: ./.env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    shm_size: '8gb'
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USERNAME}", "-d", "${DB_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - molmedb-db:/var/lib/postgresql/data
    networks:
      - molmedb-network

  db-predictions:
    build: ./database/extensions/bingo
    platform: linux/amd64
    privileged: true
    container_name: molmedb-predictions-db
    env_file: ./.env
    environment:
      POSTGRES_DB: ${DB_PREDICTIONS_DATABASE}
      POSTGRES_USER: ${DB_PREDICTIONS_USERNAME}
      POSTGRES_PASSWORD: ${DB_PREDICTIONS_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    shm_size: '8gb'
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_PREDICTIONS_USERNAME}", "-d", "${DB_PREDICTIONS_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - molmedb-predictions-db:/var/lib/postgresql/data
    networks:
      - molmedb-network

  redis:
    image: redis:alpine
    container_name: molmedb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - molmedb-redis:/data
    networks:
      - molmedb-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rdkit:
    build:
      context: ./modules/Rdkit/src
      dockerfile: ./../../../docker/common/rdkit/Dockerfile
    container_name: rdkit
    ports:
      - "127.0.0.1:9696:80"
    restart: unless-stopped
    networks:
      - molmedb-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/test', timeout=5)"]
      interval: 120s
      timeout: 10s
      retries: 5
      start_period: 10s

  cdkdepict:
    image: simolecule/cdkdepict:latest
    container_name: cdkdepict
    networks:
      - molmedb-network
    # Public through the web service (/depict/), published for debugging only.
    ports:
      - "127.0.0.1:1661:8080"
    restart: unless-stopped    


volumes:
  molmedb-db:
  molmedb-predictions-db:
  molmedb-redis:

networks:
  molmedb-network:
