events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    # Limit concurrent PHP-FPM connections globally (protects workers from crawler floods).
    limit_conn_zone $server_name zone=php_conn:1m;
    limit_conn_zone $binary_remote_addr zone=php_conn_ip:10m;

    # FastCGI cache for public read-only API responses.
    fastcgi_cache_path /var/cache/nginx/fastcgi
        levels=1:2
        keys_zone=api_cache:20m
        inactive=1h
        max_size=512m;
    fastcgi_cache_key "$request_method$host$request_uri";

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    map $http_x_forwarded_proto $fastcgi_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    map $http_x_forwarded_host $fastcgi_forwarded_host {
        default $http_x_forwarded_host;
        "" $host;
    }

    map $http_x_forwarded_port $fastcgi_forwarded_port {
        default $http_x_forwarded_port;
        "" $server_port;
    }

    server {
        listen 443;
        listen [::]:443;
        server_name localhost;
        root /var/www/public;
    
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    
        index index.php;
    
        charset utf-8;
    
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
    
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Sitemaps are generated by `php artisan sitemap:generate` into the
        # shared storage volume (config fair.sitemap_path).
        location ~ ^/sitemap[^/]*\.xml$ {
            root /var/www/storage/app/sitemaps;
            default_type application/xml;
            try_files $uri =404;
        }
    
        error_page 404 /index.php;

        # Cache public structure/mol API responses at Nginx level — PHP-FPM is hit
        # only once per unique URL per hour, regardless of how many bots request it.
        location ~ ^/api/(structure|mol)/ {
            limit_conn php_conn    40;
            limit_conn php_conn_ip 10;
            limit_conn_status 503;

            # Skip cache for authenticated users (session cookie present).
            # Bots have no session cookie → served from cache.
            # Logged-in users → always get fresh response from PHP-FPM.
            fastcgi_cache_bypass $cookie_molmedb_session;
            fastcgi_no_cache     $cookie_molmedb_session;

            fastcgi_cache api_cache;
            fastcgi_cache_valid 200 1h;
            fastcgi_cache_valid 404 1m;
            fastcgi_cache_use_stale error timeout updating http_500 http_503;
            fastcgi_cache_background_update on;
            fastcgi_cache_lock on;
            fastcgi_ignore_headers Cache-Control Expires Set-Cookie;
            add_header X-Cache-Status $upstream_cache_status;

            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_PROTO $fastcgi_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_HOST $fastcgi_forwarded_host;
            fastcgi_param HTTP_X_FORWARDED_PORT $fastcgi_forwarded_port;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ \.php$ {
            limit_conn php_conn    40;
            limit_conn php_conn_ip 10;
            limit_conn_status 503;

            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_PROTO $fastcgi_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_HOST $fastcgi_forwarded_host;
            fastcgi_param HTTP_X_FORWARDED_PORT $fastcgi_forwarded_port;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
