events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Redirects made by nginx itself (e.g. /api/v1 -> /api/v1/) stay relative:
    # the scheme, host and port the client used are those of the TLS proxy.
    absolute_redirect off;
    client_max_body_size 20M;

    # Upstreams are addressed through variables and resolved by Docker's DNS
    # at request time, so nginx starts even while e.g. the frontend is down.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Limit concurrent PHP-FPM connections globally (protects workers from crawler floods).
    limit_conn_zone $server_name zone=php_conn:1m;
    limit_conn_zone $binary_remote_addr zone=php_conn_ip:10m;

    # FastCGI cache for public read-only API responses.
    fastcgi_cache_path /var/cache/nginx/fastcgi
        levels=1:2
        keys_zone=api_cache:20m
        inactive=1h
        max_size=512m;
    fastcgi_cache_key "$request_method$host$request_uri";

    # The TLS proxy in front (Apache) and Docker networks are trusted to tell
    # the client's address; it is what the API rate limiters count with.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    # X-Forwarded-For passed on: the chain received from the proxy in front
    # plus that proxy's own address ($remote_addr already is the client).
    map $http_x_forwarded_for $forwarded_for {
        default "$http_x_forwarded_for, $realip_remote_addr";
        "" $remote_addr;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        "" $host;
    }

    map $http_x_forwarded_port $forwarded_port {
        default $http_x_forwarded_port;
        "" $server_port;
    }

    # Upgrade of the frontend's WebSocket connections, if any.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # One server per domain: templates/molmedb.conf.template, rendered with
    # the domain names from the environment by the nginx image on start.
    include /etc/nginx/conf.d/*.conf;
}
