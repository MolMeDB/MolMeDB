# Passes the request to Laravel (PHP-FPM). Included by the locations that
# serve the backend; $laravel_uri is the URI Laravel routes (set before
# including this file).
limit_conn php_conn    40;
limit_conn php_conn_ip 10;
limit_conn_status 503;

include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param REQUEST_URI $laravel_uri;
fastcgi_param HTTP_X_FORWARDED_FOR $forwarded_for;
fastcgi_param HTTP_X_REAL_IP $remote_addr;
fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
fastcgi_param HTTPS $fastcgi_https if_not_empty;
fastcgi_param HTTP_X_FORWARDED_HOST $forwarded_host;
fastcgi_param HTTP_X_FORWARDED_PORT $forwarded_port;
fastcgi_hide_header X-Powered-By;
fastcgi_pass $php_upstream;
