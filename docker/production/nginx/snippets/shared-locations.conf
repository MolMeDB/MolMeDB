# Locations served the same way on the site and the admin domain.

# 2D structure depictions (CDK Depict), the URL in CDK_DEPICT_URL.
location ^~ /depict/ {
    set $depict_upstream cdkdepict:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $forwarded_for;
    proxy_pass http://$depict_upstream;
}

# Sitemaps are generated by `php artisan sitemap:generate` into the shared
# storage volume (config fair.sitemap_path).
location ~ ^/sitemap[^/]*\.xml$ {
    root /var/www/storage/app/sitemaps;
    default_type application/xml;
    try_files $uri =404;
}

# The MCP server (Streamable HTTP): responses may be streamed as
# server-sent events, so they must not be buffered.
location = /api/v1/mcp {
    fastcgi_buffering off;
    include /etc/nginx/snippets/laravel.conf;
}

# Public REST API, its documentation and OpenAPI specification.
location ^~ /api/v1/ {
    include /etc/nginx/snippets/laravel.conf;
}
